name: release

# 태그를 밀 때만 돕니다.
#
# pull_request로는 절대 트리거하지 않습니다. 이 저장소는 공개라, PR에서
# 워크플로가 돌면 포크에서 온 코드가 서명 키 시크릿에 접근할 수 있습니다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 빌드는 캐시가 없으면 매번 400개 남짓한 crate를 새로 컴파일합니다.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      # 명세는 배포 전에 반드시 통과해야 합니다. 제목 파싱이 깨지면 사용자가
      # 적은 내용이 조용히 잘려 나가고, 배치가 깨지면 위젯이 화면을 가로막습니다.
      - name: 명세 (파싱 · 표기 · 배치)
        run: npm test

      - name: 타입 검사
        run: npm run check

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gravitask ${{ github.ref_name }}'
          releaseBody: |
            ### 설치

            아래 `.exe`를 받아 실행하세요.

            서명 인증서가 아직 없어 첫 실행에서 SmartScreen 경고가 뜹니다.
            **추가 정보 → 실행**을 눌러 진행하시면 됩니다.
          releaseDraft: true
          prerelease: false
